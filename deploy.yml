# 睡眠記録アプリ (Sleep Tracker)

ワンタップで就寝・起床を記録できるシンプルな睡眠トラッカー。詳細な入力（睡眠の質・気になったこと・メモ）や手動追加にも対応しています。星座モチーフの4人のキャラクターが、直近の睡眠状況に応じてコメントしてくれます。

## 主な機能

- ワンタップで就寝/起床を記録。バックグラウンドでも計測を継続
- 起床時のクイック評価（星5段階・タグ・メモ）
- 手動での記録追加・編集・削除
- 「眠りのダイヤル」による前夜の睡眠の可視化
- 直近7件の平均睡眠時間グラフ
- 4人のキャラクター（すぴか・こと・すばる・こぐま）による応援コメント
  - 記録内容（連続達成日数・睡眠時間・起床時刻など）に応じてセリフが変化
  - 隠しイベント: 記録の節目（7/30/100日）、久しぶりの再開、パーフェクトウィーク、徹夜検知、正午起き、深夜スタート、ぴったり睡眠時間 など
- 目標睡眠時間の設定（歯車アイコンから）
  - 目標の就寝時刻・起床時刻を指定（睡眠時間のプリセットを選ぶと起床時刻を自動調整）
  - 寝不足/寝すぎ/連続達成/ぴったり睡眠などの判定は、すべてこの目標値を基準に計算
  - 就寝・起床とも目標の20分以内に収まると「目標達成」の専用セリフが出現
  - 「昨夜の睡眠」カードに目標との差分（例: 目標より15分短い）と、眠りのダイヤルに目標時間帯の参考線を表示
- カレンダータブ（画面下部のタブから切り替え）
  - 日付ごとに目標達成率で赤（要改善）・黄（もう少し）・緑（達成）に色分け表示
  - 達成率は寝すぎより寝不足を重めに評価する非対称な計算式（同じ乖離幅でも寝すぎの方が減点が小さい）
  - 日付をタップすると、その日の記録の閲覧・編集（後から就寝/起床時刻も変更可能）、記録がない日は新規追加ができます
  - 未来の日付（記録のない日）はタップできません
- 統計タブ
  - 週/月/全期間を切り替えて、平均睡眠時間・平均達成率・平均睡眠の質・最長連続達成日数を表示
  - 達成状況の内訳（緑/黄/赤の日数）と平均就寝・起床時刻も確認できます
- 記録の時刻をあとから編集可能（記録一覧・カレンダーどちらからも、就寝・起床時刻を修正できます）
- 好感度システム（-10〜+20、4人それぞれ独立）
  - 睡眠の記録内容に応じて、4人の好感度が上下します（達成系は加点、寝不足・不規則・徹夜は減点、寝すぎは軽めの減点）
  - **キャラごとに反応の強さが違います**：すぴかは喜怒どちらも大きく反応、ことは褒めるのは渋いが心配は人一倍、すばるは常に落ち着いた反応、こぐまは良いことには温かく・悪いことには寛容。同じ記録でも4人の好感度は別々に育っていきます
  - 就寝の目標時刻からの遅刻ペナルティ：15分までの遅れはセーフ、16分以上遅れると好感度が下がります（早く寝る分にはペナルティなし）
  - **ただし、その夜の睡眠時間が目標を達成していれば、遅刻ペナルティは発生しません**（しっかり眠れた夜の高評価が、就寝時刻の遅れだけで崩れることはありません。目標未達の夜にのみ遅刻ペナルティが重なります）
  - 好感度は「低迷／ふつう／好感／大好き」の4段階。段階が上がるとセリフのトーンも変化します
  - 各カテゴリのセリフを2〜3パターンに増量（同じ状況でも表示されるセリフが変わりやすくなりました）
  - キャラクターパネルに好感度バーと数値を表示
- セリフ図鑑（キャラクターパネルの本アイコンから）
  - これまでに見たセリフ・まだ見ていないセリフをカテゴリ別に一覧表示、発見数を進捗バーで表示
- 実績バッジ（統計タブ内）
  - はじめの一歩／一週間／一ヶ月／百夜／パーフェクトウィーク／目標時刻マスター／継続は力なり／大好き認定 の8種類
  - 一度解除したバッジは記録を削除しても消えません
- 連続記録の炎アイコン（ホーム画面のあいさつ横に表示）
- 季節限定セリフ（元日・七夕・ハロウィン・クリスマス・大晦日）
- 好感度MAX到達時の特別エピソード（各キャラ「大好き」到達の瞬間に一度だけ流れる特別なメッセージ）
- 睡眠スコア・グレード表示（S/A/B/C/D。睡眠時間の達成度と目標時刻の正確さを組み合わせて算出。起床モーダル・記録一覧・「昨夜の睡眠」カードに表示）
- 起床時のキャラクターからの挨拶（「おはよう」枠のセリフを新設、4段階の好感度で変化）
- 「おやすみ」セリフをさらに増量
- 好感度変化・実績解除のトースト通知
- 設定画面からデータのバックアップ（JSONエクスポート/インポート、好感度・図鑑の発見状況・バッジも含む）
- 設定画面から全データをリセットする機能（2段階確認つき）
- アプリ内にバージョン表示（現在 v1.6.0）

## 技術構成

- React + Vite
- [lucide-react](https://lucide.dev/) アイコン
- データは `localStorage` に保存（`src/lib/storage.js`）。サーバーは不要です

## GitHub Pagesへのデプロイ（自動）

このリポジトリには `.github/workflows/deploy.yml` が含まれていて、**mainブランチにpushするだけで自動的にビルド・デプロイ**されます。

1. GitHubでこのリポジトリの **Settings → Pages** を開く
2. 「Build and deployment」の **Source** を **GitHub Actions** に設定する（「Deploy from a branch」ではありません）
3. `git push` すると、Actionsタブでビルドが走り、数分後にURLが発行されます

> ⚠️ **重要**：GitHubには必ず「ソースコードのまま」pushしてください。`npm run build` は手元で実行する必要はありません。手動でビルドした `dist/` の中身だけをpushしたり、Sourceを「Deploy from a branch」のままにしていると、変換前の `index.html`（`./src/main.jsx` という、ブラウザが直接は理解できないJSXファイルを読み込もうとするファイル）がそのまま公開されてしまい、**画面が真っ暗になります**。

## セットアップ（ローカル開発）

```bash
npm install
npm run dev
```

ブラウザで `http://localhost:5173` を開いてください。

## 手動ビルド・他社サービスへのデプロイ

```bash
npm run build
npm run preview
```

`dist/` に静的ファイルが出力されます。中身をVercel / Netlifyなどにそのままデプロイできます。GitHub Pagesを手動更新する場合も、pushするのは `dist/` の中身であって、リポジトリのソースファイルそのものではない点に注意してください（上記の自動デプロイを使えばこの手順ごと不要になります）。

## ディレクトリ構成

```
├── .github/workflows/deploy.yml  # push時に自動ビルド・デプロイ
├── index.html
├── package.json
├── vite.config.js
├── public
│   ├── manifest.json
│   ├── apple-touch-icon.png
│   ├── icon-192.png / icon-512.png
│   └── favicon-32.png
└── src
    ├── main.jsx        # エントリーポイント
    ├── App.jsx          # アプリ本体
    └── lib
        └── storage.js   # localStorage ラッパー
```

## iPhoneでの使い方

Safariでデプロイ先のURLを開き、共有ボタン →「ホーム画面に追加」を選ぶと、アイコン付きのアプリのように起動できます（ステータスバー・ノッチ・ホームインジケーターの余白にも対応済みです）。

- `npm run dev` で表示される `localhost` のURLは**自分のPCの中でしか開けません**。iPhoneの実機で試すには、上記のGitHub Pages自動デプロイ、またはVercel/NetlifyなどにデプロイしてそのURLをiPhoneのSafariで開いてください。
- `index.html` ファイルを直接ダブルクリックして開くと真っ白になります（ブラウザで開く場合は必ず `npm run dev` または `npm run build` → `npm run preview` を使ってください）。

## iPhone向けの最適化内容

- ホーム画面追加時にアイコン・アプリ名が表示されるよう `manifest.json` と `apple-touch-icon` を追加
- ノッチ・ホームインジケーターの領域にコンテンツが被らないよう `env(safe-area-inset-*)` で余白を確保
- 入力欄はすべてフォントサイズ16px以上にし、フォーカス時にSafariが自動ズームしてしまう不具合を回避
- `100dvh` を使用し、Safariのアドレスバー表示/非表示による高さのガタつきを防止
- タップ時のハイライト色を無効化し、ボタンの `touch-action: manipulation` でタップの反応を高速化

## カスタマイズ

- キャラクターの名前・口調・カラーは `App.jsx` 内の `CHARS` / `CHAR_LINES` を編集してください
- 隠しイベントの発生条件は `computeSleepState` 関数内にまとまっています
- 目標睡眠時間の初期値は `App.jsx` 内の `DEFAULT_SETTINGS`（就寝23:30・起床07:00）を編集してください

